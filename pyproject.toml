[project]
name = "elenctic"
version = "1.0.0"
description = "Contracts and queries for answer set programs: a library first, a command line second"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregory Gelfond", email = "gregory_gelfond@fastmail.com" }]
requires-python = ">=3.14"
dependencies = ["clingo>=5.8.2,<5.9"]

[project.urls]
Homepage = "https://github.com/GregoryGelfond/elenctic"
Documentation = "https://github.com/GregoryGelfond/elenctic/blob/main/docs/index.md"
Changelog = "https://github.com/GregoryGelfond/elenctic/blob/main/CHANGELOG.md"
Issues = "https://github.com/GregoryGelfond/elenctic/issues"

[project.optional-dependencies]
theory = ["clingcon>=5.2.1,<5.3"]

[project.scripts]
elenctic = "elenctic.cli:main"

[dependency-groups]
dev = ["clingcon>=5.2.1,<5.3", "import-linter>=2.5", "mypy>=2.4", "pyright>=1.1.414", "ruff>=0.17", "pytest>=9", "hypothesis>=6.170"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elenctic"]

[tool.hatch.build.targets.wheel.force-include]
"docs/reference/output-v1.schema.json" = "elenctic/output-v1.schema.json"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src:scripts"
files = ["src", "tests", "scripts"]
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
  "truthy-bool", "truthy-iterable", "redundant-expr", "possibly-undefined",
  "ignore-without-code", "unused-awaitable", "explicit-override", "mutable-override",
]
extra_checks = true
local_partial_types = true
disallow_any_unimported = true

[tool.pyright]
include = ["src", "scripts"]
extraPaths = ["src", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "TC001", "TC002", "TC003", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["elenctic.search.Limits"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "INP001", "FBT001"]
"scripts/**" = ["INP001", "PLR2004", "T201", "S603", "S311"]
"src/elenctic/cli.py" = ["S603", "S311"]

[tool.importlinter]
root_package = "elenctic"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "a module imports only from its own layer and the layers below it"
type = "layers"
layers = [
    "elenctic.cli",
    "elenctic.check | elenctic.human | elenctic.json_view",
    "elenctic.judge",
    "elenctic.presentation",
    "elenctic.by_answer_sets | elenctic.glyphs | elenctic.report",
    "elenctic.reader | elenctic.verdicts",
    "elenctic.directives | elenctic.engine | elenctic.gates | elenctic.queries | elenctic.readings | elenctic.wellformed | elenctic.writer",
    "elenctic.contract | elenctic.operands",
    "elenctic.grounded | elenctic.query | elenctic.syntax",
    "elenctic.unify",
    "elenctic.classes | elenctic.patterns | elenctic.rows | elenctic.search",
    "elenctic.facts | elenctic.normalize | elenctic.relation | elenctic.substitution | elenctic.theory",
    "elenctic.body | elenctic.determination | elenctic.extension | elenctic.program | elenctic.tags | elenctic.terms",
    "elenctic.about | elenctic.braces | elenctic.display | elenctic.literals | elenctic.paint | elenctic.partition | elenctic.spans | elenctic.tree",
    "elenctic.traversal",
]

[[tool.importlinter.contracts]]
id = "clingo-boundary"
name = "only the modules that read and run programs import clingo; judging, reading contracts and reporting never do"
type = "forbidden"
source_modules = ["elenctic"]
forbidden_modules = ["clingo"]
allow_indirect_imports = true
ignore_imports = [
    "elenctic.body -> clingo",
    "elenctic.classes -> clingo",
    "elenctic.engine -> clingo",
    "elenctic.facts -> clingo",
    "elenctic.grounded -> clingo",
    "elenctic.literals -> clingo",
    "elenctic.normalize -> clingo",
    "elenctic.patterns -> clingo",
    "elenctic.relation -> clingo",
    "elenctic.rows -> clingo",
    "elenctic.search -> clingo",
    "elenctic.syntax -> clingo",
    "elenctic.terms -> clingo",
    "elenctic.theory -> clingo",
    "elenctic.tree -> clingo",
]

[[tool.importlinter.contracts]]
id = "clingcon-boundary"
name = "clingcon is imported only by the theory module, the one place its optional import is guarded"
type = "forbidden"
source_modules = ["elenctic"]
forbidden_modules = ["clingcon"]
allow_indirect_imports = true
ignore_imports = ["elenctic.theory -> clingcon"]

[[tool.importlinter.contracts]]
id = "spans-are-pure"
name = "spans know nothing outside the standard library"
type = "forbidden"
source_modules = ["elenctic.spans"]
forbidden_modules = ["clingo", "clingcon", "elenctic.engine", "elenctic.check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.14"
clingo = ">=5.8.2,<5.9"

[tool.pixi.pypi-dependencies]
elenctic = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
import-linter = ">=2.5"

[tool.pixi.feature.dev.dependencies]
clingcon = ">=5.2.1,<5.3"
mypy = ">=2.4"
pyright = ">=1.1.414"
ruff = ">=0.17"
pytest = ">=9"
hypothesis = ">=6.170"

[tool.pixi.feature.theory.dependencies]
clingcon = ">=5.2.1,<5.3"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
theory = { features = ["dev", "theory"], solve-group = "theory" }
py314 = { features = ["dev", "theory", "py314"], solve-group = "py314" }
py315 = { features = ["dev", "theory", "py315"], solve-group = "py315" }

[tool.pixi.feature.dev.tasks]
check = "ruff format --check src tests scripts && ruff check --no-fix src tests scripts && mypy && pyright && lint-imports && pytest"
test = "pytest"
