[build-system]
requires = ["hatchling>=1.27"]  # [project] license-files (PEP 639) needs it
build-backend = "hatchling.build"

[project]
name = "elenctic"
dynamic = ["version"]
description = "A declarative testing framework for Answer Set Programming."
readme = "README.md"
requires-python = ">=3.14"  # deliberate floor: load-bearing 3.14 idioms. Downstream users may
                            # target lower.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregory Gelfond" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",  # the discoverability half of shipping py.typed
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = ["clingo>=5.8"]  # honest runtime dep; clingo is on conda-forge AND PyPI (no PyPI-only dep)

[project.urls]
# Two of elenctic's own diagnostics ask a reader to report a fault, and until these were here there
# was nowhere in the package, on its index page, or in its metadata that said where to.
Homepage = "https://github.com/GregoryGelfond/elenctic"
Repository = "https://github.com/GregoryGelfond/elenctic"
Issues = "https://github.com/GregoryGelfond/elenctic/issues"
Changelog = "https://github.com/GregoryGelfond/elenctic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
theory = ["clingcon>=5.2.1"]  # the theory fragment (@assign, CSP @count); conda-forge-primary

[project.scripts]
elenctic = "elenctic.cli:main"  # the corpus runner (`elenctic run TARGET`)

[tool.hatch.version]
path = "src/elenctic/__init__.py"  # single source of truth for the version (read from __version__)

[tool.hatch.build.targets.wheel]
packages = ["src/elenctic"]  # everything under here ships, including two files that are not code
                             # and are load-bearing anyway: schema/output-v*.schema.json, which
                             # `elenctic schema` reads back as a package resource, and py.typed,
                             # without which a consumer's type checker skips this package entirely
                             # and every annotation in it is invisible to them (PEP 561).
                             # Narrowing this to *.py drops both, silently, and leaves every import
                             # working — so `tests/test_packaging.py` asks the backend what it
                             # actually builds rather than trusting this comment.

[tool.ruff]
# Formatter is `ruff format` — black-compatible.
# target-version is inferred from project.requires-python (>=3.14).
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# The second group was chosen by measuring each family against this codebase rather than by
# reputation: every one of them was either already clean — so it is a ratchet that holds a property
# the code has, and costs nothing to keep — or it earns its exceptions below. Families measured and
# deliberately NOT taken: Q and ICN (the formatter already owns quotes, and nothing here imports the
# libraries ICN renames), DJ/NPY/PD/DTZ/FA (none can fire), and COM, which is the one family
# measured to disagree with the formatter.
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "A", "C4", "EXE", "FLY", "G", "ISC", "LOG", "PERF", "PIE", "PTH", "RET", "RSE", "SLOT", "TID",
    "T20", "YTT",
    # Every rule pytest's own family has, and it earns the place in a project that cares this much
    # about what a failure says. PT018 splits `assert a and b`, so a failure names which half; PT011
    # refuses a bare `pytest.raises(ValueError)` with no `match`, which can pass on an entirely
    # different ValueError raised somewhere underneath — a green test asserting a fault the code
    # never had.
    "PT",
    # Four docstring rules, not the family, and chosen by measuring what each would cost here. Most
    # of what `D` as a whole costs is D103 on tests, which asks for a docstring on every test —
    # including the ones whose name has already said what they hold. What this suite writes instead
    # is a comment at the head of the body where the defect a test guards is not evident from its
    # name, and a docstring where that reason runs to a paragraph. D205 and D209
    # are the next largest share and impose a one-line summary on prose deliberately opened as a
    # multi-line sentence. D415 is that same imposition wearing another hat — measured, its findings
    # here are opening sentences that wrap, not summaries missing a full stop — so it is left out
    # with them. What is kept is the part that catches something missing or malformed rather than
    # differently shaped.
    #
    # The counts those judgements were made from are deliberately not written here. They were, and
    # every one of them had drifted by the next reading: a number in a comment is a second thing to
    # keep true, and nothing prompts an edit to it. Re-measure with `ruff check . --select D103`.
    "D100", "D102", "D301", "D403",
]
# We deliberately use mathematical Unicode (⋂ ⋃ ⊆ ⊇ → ≤ ∅ ∈ …) as KR notation in
# comments and docstrings; the ambiguous-Unicode (homoglyph) rules would flag it.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-pytest-style]
# PT011 asks for a `match=` on the broad built-in families by default, and cannot ask on a family it
# has never heard of — so elenctic's own exceptions were left to a sentence in CONTRIBUTING.md, and
# a convention nobody could enforce decayed exactly as one does: the count of `pytest.raises`
# written without a `match=` grew across two releases rather than shrinking.
#
# Both spellings of each class, because ruff resolves a name to whatever the import statement spells
# and does not follow a re-export: a test importing from the defining module and one importing from
# the curated surface are asking about two different dotted names, and only one of them would be
# asked about otherwise.
#
# This list is DERIVED, not maintained. `test_the_lint_asks_for_a_match_on_every_exception_this
# _package_defines` walks the package and requires this to be exactly what it finds, so a ninth
# exception class fails that check rather than quietly falling outside the gate — and the failure
# prints the list to paste. Narrow built-ins are deliberately outside it: what is asked for is
# ruff's own broad families plus what this package defines, and a synthetic `ZeroDivisionError`
# raised by a test double belongs to neither.
raises-extend-require-match-for = [
    "elenctic.ContainmentError",
    "elenctic.ContractError",
    "elenctic.DiscoveryError",
    "elenctic.HarnessError",
    "elenctic.ProgramError",
    "elenctic.RoutingError",
    "elenctic.SeamError",
    "elenctic.SolverUnavailableError",
    "elenctic.discovery.DiscoveryError",
    "elenctic.discovery.SolverUnavailableError",
    "elenctic.expectation.ContractError",
    "elenctic.program.ContainmentError",
    "elenctic.program.ProgramError",
    "elenctic.result.HarnessError",
    "elenctic.result.SeamError",
    "elenctic.run.RoutingError",
]

[tool.ruff.lint.isort]
# The curated surface re-exports each name as itself (`X as X`), which is how a type checker is told
# that a name imported into a package's __init__ is part of its public API — without it, every
# consumer running a strict check is told the package exports nothing. Left alone, isort gives each
# aliased name an import statement of its own — one line per curated name, where the curated surface
# is most of what this package is. The count is deliberately not written here: it said sixty-five
# when it was already sixty-eight, because nothing prompts an edit to a comment when a name is
# added, and the mechanism is what the setting is here for.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# The package __init__ re-exports the curated API for static visibility (a TYPE_CHECKING block
# feeding the PEP 562 lazy resolver); those imports are intentional re-exports, not dead code.
"__init__.py" = ["F401"]
# The modules that are meant to write to a terminal: the command line, the renderer that turns a run
# into prose, the streams layer the command line hands standard output over through, and the four
# whose documented
# `python -m elenctic.MODULE FILE.lp` entry point prints an inspection of one stage. Every other
# module in the package prints nothing, and no test prints — measured, which is what makes T20 a
# guarantee here rather than a style preference. Note the rule's fix DELETES the print, so an
# --unsafe-fixes run without these would quietly remove elenctic's own output. The list is the
# count: a number written above it would be a second place to keep in step, for no gain over
# reading the lines under it.
"src/elenctic/cli.py" = ["T201"]
"src/elenctic/human_report.py" = ["T201"]
"src/elenctic/streams.py" = ["T201"]
"src/elenctic/discovery.py" = ["T201"]
"src/elenctic/expectation.py" = ["T201"]
"src/elenctic/run.py" = ["T201"]
"src/elenctic/solvers.py" = ["T201"]
# The observer protocol's no-op default bodies are spelled `return None`, and RET501 wants them
# bare. They cannot be: mypy treats a function whose body is only a docstring as *implicitly
# abstract*, and its own diagnostic names the remedy — "if it is not meant to be abstract,
# explicitly `return` or `return None`". A bare body would make every announcement mandatory for
# any class inheriting the protocol, which is the opposite of what a default is for. Scoped to this
# file rather than turned off, so a protocol written elsewhere meets the same question deliberately
# instead of inheriting the answer.
"src/elenctic/corpus.py" = ["RET501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["tests"]  # so shared test scaffolding (tests/support.py) is importable

[tool.mypy]
strict = true
warn_unreachable = true
strict_equality = true  # already implied by strict; written out because it is load-bearing here
# A name that is bound on some paths and read on all of them. Off under `strict`, and the defect it
# names is the one a fault handler is most exposed to: the handler runs because something above it
# did not finish, so anything bound up there may be unbound down here — and the failure arrives as a
# second, unrelated error raised while reporting the first. Enabling it makes where a value is bound
# a checked property rather than a reviewed one.
enable_error_code = ["possibly-undefined"]
files = ["src", "tests"]
exclude = ["tests/spikes/"]

[[tool.mypy.overrides]]
module = ["clingcon", "clingcon.*"]
ignore_missing_imports = true

[tool.coverage.run]
# `branch` because a statement-only measure calls a two-armed `if` covered when one arm ever ran,
# and the arms this package cares about most are refusals — the half a test is least likely to take.
branch = true
# `parallel`, with `COVERAGE_PROCESS_START` set by the task, because a large part of this suite runs
# elenctic as a CHILD PROCESS: everything about which stream a byte landed on has to, since a test
# runner replaces this language's standard output with an object of its own. Without it the whole
# machine-readable path reads as dead code — measured, `cli.py` alone went from 89% to 99% when the
# children were followed, having changed not at all.
parallel = true
source = ["elenctic"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# A ratchet, not an aspiration: this is the figure the suite reaches today, so a change that lowers
# it fails rather than being noticed later or not at all. It is held by `pixi run check`, which runs
# the suite under coverage rather than beside it.
#
# What the number counts is stated where it can be checked: statements AND branches, with the
# exhaustiveness arms and the import-time integrity assertions excluded below, and with child
# processes followed. Each of those three moves the figure, so a floor quoted without them is a
# different measurement wearing the same percentage.
fail_under = 99.6
# The exhaustiveness arms. `assert_never` is reached only by a value the type system says cannot
# exist, so the arm is unreachable exactly while the taxonomy it guards is complete — and a test
# that reached one would have to construct the impossible value first. Excluded rather than waived
# per-site: a `# pragma: no cover` on each is a claim about each, and this is one claim about all.
# The arm is any `case` whose body is that call — written from what an exhaustiveness arm IS,
# rather than from the two spellings this package happens to use (`case _:` and
# `case unreachable:`), which is a rule that would need widening the next time one is written.
exclude_also = [
    "^\\s*case [^\\n]*:\\n\\s*assert_never\\(",
    # The import-time integrity assertions, identified by the marker they already carry. Each
    # compares two tables in this package — the registered solvers against their backing modules,
    # the lowering rows against the mode taxonomy, the facades against the registry — and fires
    # only if those have drifted apart. That is the same condition as an exhaustiveness arm: not
    # reachable by any input, only by the package being internally inconsistent, and a test that
    # reached one would have to corrupt a module to do it.
    #
    # The marker is the discriminator rather than `raise AssertionError`, which would also swallow
    # the lowering-row guard in `run._Lowering.__post_init__` — that one takes a value a caller
    # constructs, so it IS reachable, and it is provoked by a test.
    # Anchored to the `if`, not to the marker alone: the same marker appears as a standalone
    # comment inside `run._Lowering.__post_init__`, whose guard takes a value a caller constructs
    # and IS provoked by a test. Matching the bare marker leaves that guard one edit — moving the
    # comment up onto the `if` line, which is how the other four are written — from silently
    # leaving the denominator.
    "^\\s*if .*# raised, not asserted",
]
