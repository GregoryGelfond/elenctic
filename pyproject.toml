[project]
name = "aspnext"
version = "0.0.0"
description = "Contracts and queries for answer set programs: a library first, a command line second"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["clingo>=5.8.2,<5.9"]

[project.scripts]
aspnext = "aspnext.cli:main"

[dependency-groups]
dev = ["mypy>=2.4", "ruff>=0.17", "pytest>=9", "hypothesis>=6.170"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aspnext"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["aspnext"]
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
  "truthy-bool", "truthy-iterable", "redundant-expr", "possibly-undefined",
  "ignore-without-code", "unused-awaitable", "explicit-override", "mutable-override",
]
extra_checks = true
local_partial_types = true
disallow_any_unimported = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "TC001", "TC002", "TC003", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "FBT001"]
"src/aspnext/check.py" = ["RUF001"]
"src/aspnext/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
