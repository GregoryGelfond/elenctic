[project]
name = "elenctic"
version = "0.0.0"
description = "Contracts and queries for answer set programs: a library first, a command line second"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["clingo>=5.8.2,<5.9"]

[project.optional-dependencies]
theory = ["clingcon>=5.2.1,<5.3"]

[project.scripts]
elenctic = "elenctic.cli:main"

[dependency-groups]
dev = ["mypy>=2.4", "ruff>=0.17", "pytest>=9", "hypothesis>=6.170"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elenctic"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src:scripts"
files = ["src", "tests", "scripts"]
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
  "truthy-bool", "truthy-iterable", "redundant-expr", "possibly-undefined",
  "ignore-without-code", "unused-awaitable", "explicit-override", "mutable-override",
]
extra_checks = true
local_partial_types = true
disallow_any_unimported = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "TC001", "TC002", "TC003", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "FBT001"]
"scripts/**" = ["INP001", "PLR2004", "T201", "S603", "S311"]
"src/elenctic/check.py" = ["RUF001"]
"src/elenctic/cli.py" = ["T201", "S603", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.14"
clingo = ">=5.8.2,<5.9"

[tool.pixi.pypi-dependencies]
elenctic = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
mypy = ">=2.4"
ruff = ">=0.17"
pytest = ">=9"
hypothesis = ">=6.170"

[tool.pixi.feature.theory.dependencies]
clingcon = ">=5.2.1,<5.3"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
theory = { features = ["dev", "theory"], solve-group = "theory" }

[tool.pixi.feature.dev.tasks]
check = "ruff format --check src tests scripts && ruff check --no-fix src tests scripts && mypy && pytest -q"
test = "pytest -q"
