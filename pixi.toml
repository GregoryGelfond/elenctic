# Toolchain for elenctic, pinned. Baseline: `pixi run <cmd>` / `pixi shell`.
# clingo and clingcon come from conda-forge, which is where they are packaged.
# clingcon is pinned to 5.2.1 and Python to 3.14, which the language features this project
# relies on require.
[workspace]
name = "elenctic"
description = "A declarative testing framework for Answer Set Programming."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.14.*"
clingo = "5.8.*"
clingcon = "5.2.1.*"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"
mypy = "*"
ruff = "*"
# Checks the packaged output schema against the documents the package produces. A test-only tool:
# elenctic prints its schema and never validates against it, so this must not become a runtime
# dependency in pyproject.toml — a consumer installing elenctic is not installing a validator.
jsonschema = "*"
types-jsonschema = "*"  # it ships no types of its own, and the gate is mypy --strict
# The build backend this project declares, here so a test can ask it what it actually puts in a
# distribution. Two files that are not code are load-bearing — py.typed, without which every
# annotation is invisible to a consumer, and the packaged output schema — and both had to be checked
# by hand against a built artifact until now. A test-only tool, like jsonschema above: elenctic does
# not build itself at runtime, so this must not become a dependency in pyproject.toml.
hatchling = ">=1.27"

[pypi-dependencies]
elenctic = { path = ".", editable = true }

[tasks]
test = "pytest -q"
lint = "ruff check . && ruff format --check ."
# The other half of `lint`, which reports formatting and applies none of it. Deliberately only the
# formatter: `ruff check --fix` changes what the code says, and a task named `fmt` that also did
# that would be doing something its name does not carry.
fmt = "ruff format ."
typecheck = "mypy"
# `cov` rather than `test`: it runs the same suite, and it is what holds the coverage floor. A
# number nothing gates on is a report, and this project does not keep those.
check = { depends-on = ["lint", "typecheck", "cov"] }

# `COVERAGE_PROCESS_START` is what makes the number true rather than merely large. A large part of
# this suite runs elenctic as a CHILD PROCESS — everything about which stream a byte landed on has
# to — and coverage follows a child only when that variable points it at a configuration. Without
# it the whole machine-readable path reads as untested: measured, `cli.py` alone reported 89% and
# reports 99% with the children followed, having changed not at all.
[tasks.cov]
cmd = "pytest --cov=elenctic --cov-report=term-missing"
env = { COVERAGE_PROCESS_START = "$PIXI_PROJECT_ROOT/pyproject.toml" }
