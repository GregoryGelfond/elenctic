name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # A secondary check that the package installs and its tests pass under uv, on Python 3.14, from the
  # tracked uv.lock. The gate itself is the pixi job below.
  uv-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.14 --extra theory
      - run: uv run pytest
  pixi:
    # The gate: format, lint, strict types, import contracts, tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi run -e theory check
  recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi global install rattler-build
      - run: rattler-build build --recipe recipe/recipe.yaml
