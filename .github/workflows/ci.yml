name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A secondary check that the package installs and its tests pass under uv, on Python 3.14 and 3.15,
  # from the tracked uv.lock. The gate itself is the pixi job below.
  uv-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }} --extra theory
      - run: uv run pytest
  pixi:
    # The gate: format, lint, strict types, import contracts, tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi run -e theory check
  recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi global install rattler-build
      - name: Build the recipe from this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/recipe"
          sed "s|  url: .*|  path: $GITHUB_WORKSPACE|; /  sha256:/d" \
            recipe/recipe.yaml > "$RUNNER_TEMP/recipe/recipe.yaml"
          rattler-build build --recipe "$RUNNER_TEMP/recipe/recipe.yaml"
