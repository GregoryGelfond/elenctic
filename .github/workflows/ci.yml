name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.14
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check --no-fix src tests scripts
      - run: uv run mypy
      - run: uv run pytest
  pixi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi run check
  recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
      - run: pixi global install rattler-build
      - run: rattler-build build --recipe recipe/recipe.yaml
